<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>عرض نُغَير الحي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
<style>
/* التخطيط: شريط أدوار علوي، ثم مسرح فيه أجهزة جنبًا إلى جنب (جوال المعلم يحرّك جوال الطالب ولوحة المشرف) ومعه دليل للمقدِّم */
:root{
  --primary:#22456B; --primary-strong:#1A3757; --primary-soft:#E8EFF7; --on-primary:#FFFFFF;
  --accent:#F0A92D; --accent-soft:#FDF3DD;
  --ink:#1B2733; --muted:#5C6B7A; --line:#D9E2EC; --line-strong:#A9BCCC;
  --bg:#F4F7FA; --surface:#FBFCFD; --on-soft:#DCE6F2; --danger:#B3423A;
  --sky:#7FB3E0; --sand:#E9D2A8; --grass:#6CC4A1; --wood:#8B5A2B; --coral:#E8735A; --purple:#A48CD6;
  --display:"Baloo Bhaijaan 2","SF Arabic","Segoe UI",Tahoma,sans-serif;
  --body:"Baloo Bhaijaan 2","SF Arabic","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;font-weight:500;line-height:1.55;direction:rtl;
  padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--primary);color:var(--surface);border-radius:0 0 24px 24px;padding:16px 22px}
.brand{font:800 44px/1 var(--display);color:var(--surface)}
.tag{font:700 15px/1.2 var(--display);color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.top .sub{color:var(--on-soft);font-size:14px}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin-inline-start:auto}
.role{border:1.5px solid rgba(220,230,242,.55);background:transparent;color:var(--surface);border-radius:14px;padding:8px 14px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.role .n{width:22px;height:22px;border-radius:999px;background:rgba(220,230,242,.25);color:var(--surface);font-size:12px;display:grid;place-items:center}
.role[aria-pressed="true"]{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.role[aria-pressed="true"] .n{background:var(--ink);color:var(--accent)}
.reset{border:1px solid rgba(220,230,242,.55);background:transparent;color:var(--on-soft);border-radius:999px;padding:6px 12px;font-size:12px}
.stage{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;justify-content:center}
/* الأجهزة */
.dev{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:center}
.dev .cap{font:800 18px var(--display);color:var(--primary)}
.phone{width:330px;max-width:100%;height:650px;background:var(--surface);border:6px solid var(--ink);border-radius:32px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.ph-head{padding:12px 14px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ph-head h3{margin:0;font:800 20px/1.2 var(--display);color:var(--primary)}
.ph-head small{display:block;color:var(--muted);font-size:12px;font-family:var(--body);font-weight:400}
.ph-body{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.av{width:34px;height:34px;border-radius:999px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stu{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 3px;text-align:center;font-size:12.5px;font-weight:700;color:var(--ink);position:relative;min-height:74px}
.stu .i{width:26px;height:26px;border-radius:999px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 3px;font-size:13px}
.stu small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.stu[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.stu[aria-pressed="true"] .i{background:var(--primary);color:var(--on-primary)}
.stu .me{position:absolute;top:-8px;inset-inline-start:6px;background:var(--ink);color:#fff;border-radius:999px;font-size:10px;padding:0 6px;font-weight:700}
.stu .dn{position:absolute;bottom:3px;inset-inline-end:5px;font-size:10px;color:var(--muted);font-weight:400}
.pbar{border-top:1px solid var(--line);padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.pbar .row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.prac{flex:none;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--primary);border-radius:12px;padding:9px 12px;font-weight:700;font-size:13px;max-width:210px;text-align:start}
.prac:first-child{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.prac:disabled{opacity:.45;cursor:not-allowed}
.pbar .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.link{border:0;background:transparent;color:var(--primary);font-size:12px;text-decoration:underline;padding:0}
.toast{position:absolute;inset-inline:10px;bottom:112px;background:var(--ink);color:#fff;border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;z-index:5}
.toast span{flex:1}.toast small{display:block;font-weight:400;opacity:.85}
.undo{border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.sheet{position:absolute;inset-inline:0;bottom:0;background:var(--surface);border-top:2px solid var(--ink);border-radius:18px 18px 0 0;padding:14px;z-index:6;display:flex;flex-direction:column;gap:8px}
.sheet h4{margin:0;font:800 17px var(--display)}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lv button{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:8px 4px;font-size:12.5px;font-weight:700;color:var(--ink)}
.lv button[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary)}
.btn{border:0;background:var(--primary);color:var(--on-primary);border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px}
.btn.ghost{background:var(--surface);color:var(--primary);border:1.5px solid var(--primary)}
.btn.quiet{background:transparent;color:var(--muted);border:1px solid var(--line)}
.note{font-size:12px;color:var(--muted)}
/* عالم الطالب */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{height:58px;border-radius:12px;padding:6px 8px;font-size:13px;font-weight:700;display:flex;align-items:flex-end;position:relative;color:var(--ink)}
.tile.dark{color:#fff}
.tile .q{position:absolute;top:5px;inset-inline-start:6px;width:24px;height:24px;border-radius:999px;background:var(--surface);border:2px dashed var(--primary);display:grid;place-items:center;color:var(--primary);font-size:12px}
.card{border:1px solid var(--line);border-radius:18px;padding:12px;background:#fff;box-shadow:0 1px 2px rgba(27,39,51,.08)}
.card.navy{background:var(--primary);color:var(--surface);border-color:var(--primary)}.card.navy .lab{color:var(--on-soft)}.card.navy .kpi{color:var(--surface)}
.card.sun{background:var(--accent);color:var(--ink);border-color:var(--accent)}.card.sun .lab{color:var(--ink)}
.today{display:flex;gap:12px;align-items:center}
.stamp{width:78px;height:78px;border-radius:999px;display:grid;place-items:center;position:relative;flex:none}
.stamp:before{content:"";position:absolute;inset:5px;border-radius:inherit;border:2px solid currentColor}
.stamp b{transform:rotate(-14deg);font:800 15px/1 var(--display)}
.stamp.live{color:var(--accent);border:3px solid var(--accent);box-shadow:0 0 0 7px var(--accent-soft)}
.stamp.empty{color:var(--line-strong);border:2px dashed var(--line-strong)}
.stamp.sm{width:30px;height:30px;color:var(--primary);border:2px solid var(--primary)}.stamp.sm:before{inset:3px;border-width:1.5px}
.c1{font-size:18px;line-height:1.9;font-weight:500}
.count{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.count .n{font:800 22px var(--display);color:var(--primary);margin-inline-start:6px}
.overlay{position:absolute;inset:0;background:rgba(242,246,250,.97);z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.overlay .stamp{width:150px;height:150px}.overlay .stamp b{font-size:30px}.overlay .stamp:before{inset:9px}
.land{animation:land .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes land{from{transform:scale(2.2) rotate(8deg);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.land{animation:none}}
.overlay img{width:96px;height:96px}
.spk{border:0;background:var(--primary-soft);color:var(--primary);width:44px;height:44px;border-radius:999px;display:grid;place-items:center;flex:none}
/* الطريق */
.road{position:relative;display:flex;flex-direction:column;gap:6px}
.band{height:62px;border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 10px;position:relative;font-size:12.5px;font-weight:700}
.band.dark{color:#fff}
.node{width:44px;height:44px;border-radius:999px;background:var(--surface);border:3px solid var(--primary);display:grid;place-items:center;color:var(--primary);font-weight:800;flex:none;font-size:14px}
.node.done{background:var(--primary);color:var(--on-primary)}
.node.cur{border-style:dashed;box-shadow:0 0 0 6px rgba(255,255,255,.75)}
.node.lock{border-color:var(--line-strong);color:var(--muted);border-width:2px;background:rgba(255,255,255,.7)}
.band .t{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.band .t small{font-weight:400;opacity:.9;font-size:11.5px}
.band .go{margin-inline-start:auto;border:0;background:var(--primary);color:#fff;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px}
.opt{border:1.5px solid var(--ink);background:var(--surface);border-radius:3px;padding:10px 12px;font-size:17px;line-height:1.8;text-align:start;color:var(--ink);font-weight:500}
.opt[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary)}
.fb{border:1.5px solid var(--ink);border-radius:3px;padding:10px 12px;background:var(--surface);font-size:16px;line-height:1.8}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bk button{border:2px solid var(--primary);background:var(--surface);color:var(--primary);border-radius:12px;padding:8px;font-weight:700;font-size:15px}
.bk button.ok{background:var(--primary);color:#fff}
.dots{display:flex;gap:5px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:999px;background:var(--line-strong)}.dots i.on{background:var(--primary)}
.mentor{display:flex;gap:10px;align-items:flex-end}
.mentor img{width:74px;height:74px;flex:none}
.bubble{border:1.5px solid var(--ink);border-radius:14px;padding:8px 12px;background:var(--surface);font-size:15px}
/* لوحة المشرف */
.desk{flex:1 1 640px;min-width:0;max-width:1080px;background:var(--surface);border:6px solid var(--ink);border-radius:24px;overflow:hidden}
.desk-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.desk-head h3{margin:0;font:800 22px var(--display)}
.desk-body{padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.kpi{font:800 44px/1 var(--display);color:var(--primary);font-variant-numeric:tabular-nums}
.lab{font-size:12px;color:var(--muted);font-weight:700}
.ptiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.ptile{border-radius:12px;padding:8px;font-size:12px;font-weight:700}
.ptile b{display:block;font:800 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.trend{display:flex;gap:14px;align-items:flex-end;margin-top:8px}
.trend .w{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.trend .d{display:grid;grid-template-columns:repeat(4,8px);gap:3px}
.trend .d i{width:8px;height:8px;border-radius:999px;background:var(--line-strong)}.trend .w.now .d i{background:var(--primary)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th{font-size:11.5px;color:var(--muted);text-align:start;padding:6px 8px;border-bottom:1.5px solid var(--line-strong);font-weight:700}
td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.raw{color:var(--muted);font-size:12px}
.ring{width:38px;height:38px;border-radius:999px;border:3px solid var(--primary);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--primary)}
.flag{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700}
.wide{grid-column:1/-1}
.queue{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.qrow{display:flex;gap:10px;align-items:center;border:1px dashed var(--line-strong);border-radius:12px;padding:8px 10px;font-size:13px}
.qrow span{flex:1;min-width:0}.qrow .flag{flex:none}
textarea{width:100%;border:1.5px solid var(--ink);border-radius:3px;padding:8px;font:inherit;min-height:64px;background:var(--surface);color:var(--ink)}
.foot{font-size:12px;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:10px}
.live-strip{flex:1 1 100%;max-width:1080px;display:flex;flex-wrap:wrap;gap:8px 26px;align-items:center;justify-content:center;background:var(--primary);color:var(--surface);border-radius:24px;padding:12px 20px}
.live-strip .lab{color:var(--accent);font-size:14px}
.live-strip b{font:800 28px/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums;margin-inline-start:4px}
.pulse{animation:pulse .6s ease}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>

<div class="wrap">
  <div class="top">
    <div><div class="brand">نُغَير</div><div class="tag">مع نُغَير… نُغَيِّر</div></div><div class="sub">قيمة الأمانة · الصف الأول الابتدائي</div>
    <div class="roles" id="roles"></div>
    <button class="reset" id="reset">إعادة العرض من أوله</button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="foot">بيانات تجريبية للعرض</div>
</div>
